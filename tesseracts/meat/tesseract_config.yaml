name: "brisket-meat"
version: "0.1.0"
description: >
  1D heat-moisture brisket PDE with smoothed evaporative stall; Julia/SciML with
  continuous-adjoint VJP (SciMLSensitivity InterpolatingAdjoint).

build_config:
  # Julia toolchain for the containerized build (linux/x64). Local development
  # uses Tesseract.from_tesseract_api against the host Julia instead.
  # The Julia package is staged into this directory by
  # scripts/build_containers.sh and shipped via package_data (arbitrary COPY
  # sources are not part of the tesseract build context).
  package_data:
    - ["BrisketDynamics", "/app/BrisketDynamics"]
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.9-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    - "RUN julia --project=/app/BrisketDynamics -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()' || echo 'precompile deferred to first run (package_data ordering)'"
    - "RUN chmod -R 777 /app || true"

env:
  BRISKET_JL_DIRECT: "1"
  JULIA_PROJECT: "/app/BrisketDynamics"
  PYTHON_JULIAPKG_PROJECT: "/app/BrisketDynamics"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"
