name: "brisket-pit"
version: "0.1.0"
description: >
  Lumped-parameter smoker ODE (fuel burn, damper response, wall losses, meat
  heat load); Julia with ForwardDiff dense-Jacobian VJP.

build_config:
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.9-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    - "COPY BrisketDynamics /app/BrisketDynamics"
    - "RUN julia --project=/app/BrisketDynamics -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'"
    - "RUN chmod -R 777 /app"

env:
  BRISKET_JL_DIRECT: "1"
  JULIA_PROJECT: "/app/BrisketDynamics"
  PYTHON_JULIAPKG_PROJECT: "/app/BrisketDynamics"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"
