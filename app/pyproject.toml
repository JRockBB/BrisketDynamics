[project]
name = "brisket-app"
version = "0.1.0"
description = "JAX orchestrator, Bayesian calibration, and optimal control for the Differentiable BBQ pipeline"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.35",
    "numpy>=2.0",
    "tesseract-core[runtime]>=1.0",
    "tesseract-jax>=0.1",
    "numpyro>=0.16",
    "optax>=0.2",
    "juliacall==0.9.35",
    "filelock>=3.13",
    "matplotlib>=3.9",
    "corner>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brisket_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
