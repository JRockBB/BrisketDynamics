name: CI
on:
  push:
    branches:
      - master
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  julia-tests:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  estimator-tests:
    # the RxInfer estimator suite (estimator/test), every file its own process, in shards balanced by the
    # files' wall times (estimator/test/runtests.jl prints them; 2026-09-22 on a loaded laptop: sequential 844 s,
    # segments 661, smoother 607, iterated 593, horizon 459, engine 457, ridge 437, realcook 235, physics2d 134,
    # rates 91, volatility 81, rules 64, noise 51, channels 34, misfit 31; als 455 on 2026-09-23) so each shard sits near twenty minutes
    name: Estimator shard ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: sequential, files: "test_sequential.jl test_rates.jl test_rules.jl test_volatility.jl test_channels.jl test_misfit.jl" }
          - { name: segments, files: "test_segments.jl test_smoother.jl" }
          - { name: planner, files: "test_iterated.jl test_horizon.jl test_noise.jl test_als.jl" }
          - { name: engine, files: "test_engine.jl test_ridge.jl test_realcook.jl test_physics2d.jl" }
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Instantiate the estimator project (BrisketDynamics by path, RxInfer)
        run: julia --project=estimator -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run the shard
        env:
          JULIA_FASTCHOLESKY_NO_WARN_NON_SYMMETRIC: "1"
        run: julia estimator/test/runtests.jl ${{ matrix.shard.files }}

  app-tests:
    name: App (pytest, LocalClient in-process)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - uses: astral-sh/setup-uv@v5
      - name: Run the app suite (boundary, composed-gradient gate, MPC, planner, 2-D)
        working-directory: app
        run: uv run pytest tests -q --durations=15
